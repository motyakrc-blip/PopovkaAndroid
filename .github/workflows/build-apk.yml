      - name: Build APK
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug
